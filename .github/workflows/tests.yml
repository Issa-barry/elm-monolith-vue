name: tests

on:
  pull_request:
    branches:
      - pre-prod
      - production
      - main

jobs:
  ci:
    name: PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          extensions: pcov
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy environment file
        run: cp .env.example .env

      - name: Generate application key
        run: php artisan key:generate

      - name: Build assets
        run: npm run build

      - name: Run PHPUnit with coverage
        run: ./vendor/bin/phpunit --coverage-clover coverage/clover.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/clover.xml
          retention-days: 1

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    # Smoke uniquement pour l'instant (cf. step "Run smoke E2E tests" plus bas) — quelques
    # tests, largement sous la barre des 20 min ; le budget large reste une marge de
    # sécurité (setup PHP/Node/Playwright + build), pas un dimensionnement pour la suite
    # complète (historique de cette dernière dans git blame si besoin de la restaurer).
    timeout-minutes: 20
    # .env.e2e (chargé par `php artisan serve --env=e2e`, cf. playwright.config.ts) pointe
    # sur une vraie base MySQL isolée (elm_monolithe_e2e), pas sqlite — sans ce service le
    # serveur E2E n'a aucune base à joindre : soit 500 immédiat sur /login (connexion
    # refusée), soit timeout webServer (tentative de connexion qui traîne). Miroir CI du
    # flow local `npm run e2e:db:reset` (voir package.json).
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: elm_monolithe_e2e
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-chromium-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm ci

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Cache miss → télécharge le binaire ET installe les dépendances système (apt)
      - name: Install Playwright browser + system deps (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Cache hit → binaire déjà restauré, on installe seulement les paquets système (rapide)
      - name: Install Playwright system deps only (cache hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --seed --force

      # Base dédiée à `php artisan serve --env=e2e` (cf. .env.e2e) — le service
      # mysql ci-dessus est vide au démarrage à part la DB elm_monolithe_e2e créée
      # par MYSQL_DATABASE ; il faut encore la migrer/seeder avant que Playwright
      # ne boot le serveur, exactement comme `npm run e2e:db:reset` en local.
      - name: Prepare E2E database (.env.e2e)
        run: |
          php artisan config:clear
          php artisan migrate:fresh --seed --env=e2e --force

      # APP_ENV=e2e (pas juste VITE_*) : les actions Wayfinder générées pendant ce build
      # (resources/js/actions/**) embarquent une URL absolue lue depuis config('app.url'),
      # donc depuis .env.e2e (port 8080) et non .env (port 8000) — sinon le login E2E
      # échoue systématiquement, bloqué par CORS (cf. commentaire du job ci-dessus).
      - name: Build assets
        env:
          VITE_SHOW_ENTITY_STATS_CARDS: 'true'
        run: npm run e2e:build

      # Suite complète désactivée temporairement (2026-08-21) : grosse refonte gérant/
      # prestataire en cours, et le module packing va être supprimé pour être reconstruit
      # de zéro sous le nom "production" — la suite actuelle (packing-flow, equipe-flow,
      # commission-v2-full-chain...) sera en grande partie réécrite de toute façon, la
      # laisser tourner ne fait que ralentir chaque PR sans valeur ajoutée durable. Smoke
      # uniquement le temps de la refonte, quelle que soit la branche cible ; remettre le
      # step "Run full E2E tests" (voir historique git) une fois la refonte stabilisée.
      - name: Run smoke E2E tests
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
        run: npx playwright test tests/e2e/smoke.spec.ts --workers=1

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.base_ref }}
          path: playwright-report
          retention-days: 7
