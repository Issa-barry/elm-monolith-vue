sonar.projectKey=Issa-barry_elm-monolith-vue
sonar.organization=issa-barry

sonar.sources=app,resources/js

sonar.exclusions=public/**,node_modules/**,vendor/**,lang/**,database/migrations/**,tests/**,resources/js/**/*.spec.ts,resources/js/**/*.test.ts
sonar.cpd.exclusions=lang/**,database/migrations/**

sonar.php.coverage.reportPaths=coverage/clover.xml
sonar.sourceEncoding=UTF-8

# Web:PageWithoutTitleCheck cible le <title> HTML natif : il ne reconnaît pas
# <Head :title="..."> d'Inertia (utilisé par ~130 pages resources/js/pages/**),
# le mécanisme de titre de page réellement en place dans cette SPA. Faux positif
# systématique, pas un vrai bug — exclu plutôt que de multiplier des <title>
# redondants avec Inertia sur chaque page.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=resources/js/pages/**/*.vue
